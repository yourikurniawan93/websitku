<VirtualHost *:80>
    ServerName sanetmedia.com
    ServerAlias www.sanetmedia.com
    DocumentRoot /var/www/sanetmedia/public

    <Directory /var/www/sanetmedia/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/sanetmedia_error.log
    CustomLog ${APACHE_LOG_DIR}/sanetmedia_access.log combined

    ErrorDocument 404 /404.php
</VirtualHost>
