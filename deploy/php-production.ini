; Contoh pengaturan PHP production (sesuaikan versi PHP dan kebijakan server)
expose_php = Off
display_errors = Off
log_errors = On
error_log = /var/log/php/sanetmedia-error.log
file_uploads = On
upload_max_filesize = 8M
post_max_size = 10M
max_execution_time = 30
memory_limit = 128M
session.cookie_httponly = 1
session.cookie_samesite = Lax
